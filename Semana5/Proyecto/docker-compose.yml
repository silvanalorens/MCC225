services:
  openclip:
    image: ${MCC225_IMAGE:-mcc225_gpu:latest}
    container_name: ${MCC225_CONTAINER:-mcc225_openclip}
    working_dir: /workspace/Proyecto
    volumes:
      - ./:/workspace/Proyecto
    environment:
      PYTHONPATH: /workspace/Proyecto
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: bash
